name: Production CI/CD (Docker Standalone Rolling Deploy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image (Off-Host)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push ARM64 Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-rolling:
    name: Zero-Downtime Rolling Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Step 1: Deploy to heeyaku-backend-1 while heeyaku-backend-2 handles 100% traffic
      - name: Rolling Deploy -> heeyaku-backend-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_BACKEND_1_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            echo "=== [1/2] Deploying heeyaku-backend-1 ==="
            cd /home/ubuntu/heeyaku
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export DOCKER_IMAGE="ghcr.io/${{ github.repository }}:latest"
            docker compose pull app
            docker compose up -d --remove-orphans app
            
            # Health check verification loop (max 60s)
            echo "Verifying health on backend-1..."
            for i in {1..12}; do
              if curl -s -f http://127.0.0.1:3000/api/health; then
                echo " backend-1 healthy and online!"
                exit 0
              fi
              echo "Waiting for backend-1 to become healthy ($i/12)..."
              sleep 5
            done
            echo " backend-1 healthcheck timed out! Aborting deployment."
            exit 1

      # Step 2: Deploy to heeyaku-backend-2 while heeyaku-backend-1 handles 100% traffic
      - name: Rolling Deploy -> heeyaku-backend-2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_BACKEND_2_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            echo "=== [2/2] Deploying heeyaku-backend-2 ==="
            cd /home/ubuntu/heeyaku
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export DOCKER_IMAGE="ghcr.io/${{ github.repository }}:latest"
            docker compose pull app
            docker compose up -d --remove-orphans app
            
            # Health check verification loop (max 60s)
            echo "Verifying health on backend-2..."
            for i in {1..12}; do
              if curl -s -f http://127.0.0.1:3000/api/health; then
                echo " backend-2 healthy and online!"
                exit 0
              fi
              echo "Waiting for backend-2 to become healthy ($i/12)..."
              sleep 5
            done
            echo " backend-2 healthcheck timed out!"
            exit 1
